
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantry & Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .pantry-block { background-color: #f8f9fa; border-left: 4px solid #0d6efd; padding: 15px; border-radius: 5px; }
        .tooltip-icon { color: #6c757d; cursor: pointer; margin-left: 5px; }
        /* Hidden by default, shown on successful submission */
        #successMessage { display: none; }
    </style>
</head>
<body class="bg-light pb-5">

<div class="container mt-5">
    <div class="card shadow-lg" style="max-width: 800px; margin: auto;">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0"><i class="bi bi-egg-fried"></i> Your Recipes for Today </h4>
        </div>
        <div class="card-body p-4">
            
            <!-- Success Message Alert -->
            <div id="successMessage" class="alert alert-success alert-dismissible fade show" role="alert" data-testid="success-alert">
                <strong><i class="bi bi-check-circle-fill"></i> Success!</strong> Your recipe preferences have been submitted.
                <button type="button" class="btn-close" aria-label="Close" onclick="document.getElementById('successMessage').style.display='none'"></button>
            </div>
            <!-- Error Message Alert -->
            <div id="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert" data-testid="error-alert" style="display: none;">
                <strong><i class="bi bi-exclamation-triangle-fill"></i> Error!</strong> <span id="errorText">Please correct the highlighted fields.</span>
                <button type="button" class="btn-close" aria-label="Close" onclick="document.getElementById('errorMessage').style.display='none'"></button>
            </div>
            <form id="recipeForm">
                
                <h5 class="mb-3 text-primary">Your Pantry</h5>
                <div class="pantry-block mb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label" for="meat">Meat</label>
                            <select class="form-select" id="meat" name="pantry-meat" data-testid="select-meat">
                                <option value="None">None</option>
                                <option value="Chicken">Chicken</option>
                                <option value="Pork">Pork</option>
                                <option value="Beef">Beef</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="fish">Fish</label>
                            <select class="form-select" id="fish" name="pantry-fish" data-testid="select-fish">
                                <option value="None">None</option>
                                <option value="Salmon">Salmon</option>
                                <option value="Tuna">Tuna</option>
                                <option value="Cod">Cod</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="vegetables">Vegetables</label>
                            <select class="form-select" id="vegetables" name="pantry-vegetables" data-testid="select-vegetables">
                                <option value="None">None</option>
                                <option value="Broccoli">Broccoli</option>
                                <option value="Carrots">Carrots</option>
                                <option value="Spinach">Spinach</option>
                            </select>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <h5 class="mb-3 text-primary">Meal Preferences</h5>
                
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="form-check form-switch fs-5">
                            <input class="form-check-input" type="checkbox" id="fullMatched" name="full-matched" data-testid="checkbox-full-matched">
                            <label class="form-check-label" for="fullMatched" data-bs-toggle="tooltip" data-bs-placement="top" title="When switched off, products from the pantry are matched only by the main ingredients of the recipes.">
                                Full Matched <i class="bi bi-info-circle tooltip-icon" style="font-size: 0.8rem;"></i>
                            </label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="occasion">Special Occasion</label>
                        <select class="form-select" id="occasion" name="special-occasion" data-testid="select-occasion">
                            <option value="None">None</option>
                            <option value="Birthday">Birthday</option>
                            <option value="New Year">New Year</option>
                            <option value="Easter">Easter</option>
                            <option value="Christmas">Christmas</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="peopleCount">Number of People <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-people-fill"></i></span>
                            <input type="number" class="form-control" id="peopleCount" name="people-count" data-testid="input-people-count" min="1" max="100" required placeholder="Select 1 or more">
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="form-label fw-bold">Diet Types (Hover for tips!)</label>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="diet" value="Low-Glycemic Index Diet" id="diet1" data-testid="checkbox-diet-low-glycemic">
                                <label class="form-check-label" for="diet1" data-bs-toggle="tooltip" data-bs-placement="right" title='Prioritize slow-digesting carbs like whole grains and legumes to maintain steady blood sugar levels.'>
                                    Low-Glycemic Index Diet <i class="bi bi-info-circle tooltip-icon"></i>
                                </label>
                            </div>                            
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="diet" value="Vegetarian Diet" id="diet2" data-testid="checkbox-diet-vegetarian">
                                <label class="form-check-label" for="diet2" data-bs-toggle="tooltip" data-bs-placement="right" title='Replace meat and fish with plant proteins like beans, lentils, and tofu to boost fiber intake.'>
                                    Vegetarian Diet <i class="bi bi-info-circle tooltip-icon"></i>
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="diet" value="Gastritis-Friendly Diet" id="diet3" data-testid="checkbox-diet-gastritis">
                                <label class="form-check-label" for="diet3" data-bs-toggle="tooltip" data-bs-placement="right" title='Choose non-acidic, low-fat foods like boiled potatoes and steamed fish to minimize stomach irritation.'>
                                    Gastritis-Friendly Diet <i class="bi bi-info-circle tooltip-icon"></i>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 mt-4 fs-5" data-testid="button-submit"><i class="bi bi-magic"></i> Find Recipes</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Initialize tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl)
    })

    const form = document.getElementById('recipeForm');
    const successMsg = document.getElementById('successMessage');
    const errorMsg = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');

    // Handle HTML5 validation failures
    form.addEventListener('invalid', function(e) {
        e.preventDefault(); // Prevent the native browser popup
        
        successMsg.style.display = 'none'; // Hide success if previously shown
        errorText.textContent = e.target.validationMessage; // Get the specific HTML5 error text
        errorMsg.style.display = 'block'; // Show custom error banner
        
        window.scrollTo(0, 0);
    }, true); // The 'true' captures the event during the capture phase

    // Handle successful form submission
    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent actual page reload
        
        errorMsg.style.display = 'none'; // Hide any existing errors
        successMsg.style.display = 'block'; // Show success message
        
        window.scrollTo(0, 0);
    });
</script>
</body>
</html>
