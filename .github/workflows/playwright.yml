name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      use_local:
        description: 'Run against local HTML file (USE_LOCAL=true)'
        required: false
        type: boolean
        default: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-playwright allure-pytest
        
    - name: Ensure browsers are installed
      run: python -m playwright install --with-deps
      
    - name: Run Playwright Tests
      env:
         USE_LOCAL: ${{ inputs.use_local || 'false' }}
      run: |
          pytest --browser chromium --browser firefox --alluredir=allure-results
    
    - name: Upload Allure Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
          name: allure-results
          path: allure-results
          retention-days: 20

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@v1.10
      if: always()
      id: allure-report
      with:
          allure_results: allure-results
          allure_history: allure-history
    
    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
