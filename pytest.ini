[pytest]  

log_cli=true  
log_level=DEBUG  
log_format = %(asctime)s %(levelname)s %(message)s  
log_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/pytest-logs.txt
addopts = --browser chromium --browser firefox --video retain-on-failure --screenshot only-on-failure  
# addopts = --browser webkit --device="iPhone 13" --video retain-on-failure --screenshot only-on-failure  --clean-alluredir


